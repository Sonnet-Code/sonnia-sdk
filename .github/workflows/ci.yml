name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orchestrator:
    name: Orchestrator (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      # The audio extra needs PortAudio from the system on Linux, and the
      # suite does not need a sound device, so Linux skips it.
      - name: Install
        if: runner.os != 'Linux'
        run: uv sync --locked --group dev --all-extras
      - name: Install (Linux)
        if: runner.os == 'Linux'
        run: uv sync --locked --group dev --extra camera --extra panel
      - name: Lint
        run: uv run --no-sync ruff check sonia tests
      - name: Format
        run: uv run --no-sync ruff format --check sonia tests
      - name: Type check
        run: uv run --no-sync mypy sonia
      - name: Tests
        # The suite never talks to a real model API, a microphone or a camera.
        run: uv run --no-sync pytest -q

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan the whole history with gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --no-banner --redact
