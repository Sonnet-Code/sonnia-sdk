# Congela el orquestador para Windows en un runner de GitHub. PyInstaller solo
# congela para el sistema en el que corre, así que desde un Mac no se puede.
#
# Se lanza a mano (Actions > Orquestador para Windows > Run workflow, o
# `gh workflow run orquestador-windows.yml`) y deja la carpeta sonia-orquestador
# como artefacto. Esa carpeta va a unity/Build/orquestador/Windows/ antes de la
# build de Unity para Windows (ver docs/unity.md, «Build de Windows»).
#
# No lleva claves ni frases grabadas: el .env y cache/voice los pone la build de
# Unity desde el equipo donde se compila.
name: Orquestador para Windows

on:
  workflow_dispatch:

jobs:
  congelar:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Congelar con PyInstaller
        shell: bash
        run: scripts/build_orquestador.sh
      - name: Comprobar que arranca
        shell: bash
        run: unity/Build/orquestador/Windows/sonia-orquestador/sonia-orquestador.exe --help
      - uses: actions/upload-artifact@v4
        with:
          name: sonia-orquestador-windows
          path: unity/Build/orquestador/Windows/sonia-orquestador
          if-no-files-found: error
          retention-days: 14
